<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuratore Quadro Elettrico 3D</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; background: #1a1a1a; color: white; }
        #ui-container { position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(0,0,0,0.8); padding: 20px; border-radius: 10px; border: 1px solid #444; width: 250px; }
        h2 { margin-top: 0; font-size: 18px; color: #00ffcc; }
        .btn-group { display: flex; flex-direction: column; gap: 10px; }
        button { background: #333; color: white; border: 1px solid #555; padding: 10px; cursor: pointer; border-radius: 5px; transition: 0.3s; text-align: left; }
        button:hover { background: #00ffcc; color: black; }
        #info { position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.6); padding: 10px; font-size: 12px; }
        canvas { display: block; }
    </style>
</head>
<body>

<div id="ui-container">
    <h2>Componenti</h2>
    <div class="btn-group">
        <button onclick="addModule('C5', 0x3498db, 1)">+ Interruttore C5 (1 mod)</button>
        <button onclick="addModule('D100', 0xe74c3c, 2)">+ Interruttore D100 (2 mod)</button>
        <button onclick="addModule('Timer', 0xf1c40f, 1)">+ Timer Digitale (1 mod)</button>
        <button onclick="addModule('Presa', 0x95a5a6, 2)">+ Presa Servizio (2 mod)</button>
        <button onclick="clearPanel()" style="margin-top:20px; border-color: #ff4444;">Svuota Quadro</button>
    </div>
</div>

<div id="info">
    Usa il <b>Mouse</b> per ruotare (Sinistro) e zoomare (Rotella).<br>
    I moduli si dispongono automaticamente sulla guida DIN.
</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    let scene, camera, renderer, controls;
    let modules = [];
    const MOD_WIDTH = 0.5; // Larghezza di 1 modulo DIN in unità 3D
    let currentX = -4.5; // Punto di partenza sulla guida

    init();
    animate();

    function init() {
        // 1. Scena e Camera
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x222222);
        
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 8);

        // 2. Renderer
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 3. Luci
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(5, 5, 5).target.position.set(0, 0, 0);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040, 2));

        // 4. Creazione Scocca Quadro
        const panelGeo = new THREE.BoxGeometry(10, 6, 1);
        const panelMat = new THREE.MeshPhongMaterial({ color: 0xcccccc });
        const panel = new THREE.Mesh(panelGeo, panelMat);
        panel.position.z = -0.6;
        scene.add(panel);

        // 5. Guida DIN (Rappresentata come barra metallica)
        const dinGeo = new THREE.BoxGeometry(9.5, 0.4, 0.2);
        const dinMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.8 });
        const dinRail = new THREE.Mesh(dinGeo, dinMat);
        scene.add(dinRail);

        // 6. Controlli
        controls = new OrbitControls(camera, renderer.domElement);
        
        window.addEventListener('resize', onWindowResize, false);
    }

    // Funzione globale per aggiungere moduli (accessibile dai bottoni)
    window.addModule = function(name, color, widthUnits) {
        if (currentX + (widthUnits * MOD_WIDTH) > 4.5) {
            alert("Spazio esaurito sulla guida DIN!");
            return;
        }

        const width = widthUnits * MOD_WIDTH;
        const geo = new THREE.BoxGeometry(width - 0.05, 1.2, 0.8);
        const mat = new THREE.MeshPhongMaterial({ color: color });
        const mod = new THREE.Mesh(geo, mat);

        // Posizionamento: si sposta l'origine del modulo per affiancarlo correttamente
        mod.position.x = currentX + (width / 2);
        mod.position.y = 0;
        mod.position.z = 0.4;

        // Aggiungi un'etichetta visiva semplice (simulata con un wireframe sopra)
        const edge = new THREE.EdgesGeometry(geo);
        const line = new THREE.LineSegments(edge, new THREE.LineBasicMaterial({ color: 0xffffff }));
        mod.add(line);

        scene.add(mod);
        modules.push(mod);
        currentX += width;
    }

    window.clearPanel = function() {
        modules.forEach(m => scene.remove(m));
        modules = [];
        currentX = -4.5;
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }
</script>
</body>
</html>
